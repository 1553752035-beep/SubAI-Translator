<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubAI Translator - UI 原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; }
        /* 模拟 Tauri 窗口样式 */
        .app-window { width: 1200px; height: 800px; margin: 2rem auto; background: #fff; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #e5e7eb; }
        .window-titlebar { height: 32px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 16px; font-size: 12px; color: #6b7280; }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 图标组件 (SVG) ---
        const IconHome = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>;
        const IconList = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>;
        const IconUpload = () => <svg className="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        const IconBack = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>;

        // --- 模拟数据 ---
        const MOCK_TASKS = [
            { id: 't-001', name: 'Delta Force 2026.04.16 - 18.15.mp4', status: '已完成', subtitles: 29 },
            { id: 't-002', name: 'Gameplay_Demo.mp4', status: '已完成', subtitles: 15 },
        ];

        // ==========================================
        // 页面组件
        // ==========================================

        // 1. 确认页 (第二级页面)
        const SubtitleEditor = ({ taskId, onBack }) => {
            const task = MOCK_TASKS.find(t => t.id === taskId) || MOCK_TASKS[0];
            
            return (
                <div className="flex flex-col h-full bg-white w-full animate-fade-in">
                    {/* 顶部导航与面包屑 */}
                    <header className="flex items-center px-6 py-3 border-b border-gray-200 bg-gray-50">
                        <button onClick={onBack} className="flex items-center text-sm text-gray-600 hover:text-indigo-600 font-medium transition-colors">
                            <IconBack /> <span className="ml-1">返回主界面</span>
                        </button>
                        <div className="ml-6 text-sm text-gray-400 flex items-center space-x-2">
                            <span>主界面</span>
                            <span>/</span>
                            <span>任务列表</span>
                            <span>/</span>
                            <span className="text-gray-800 font-medium">确认字幕</span>
                        </div>
                    </header>

                    {/* 主体区域 */}
                    <div className="flex-1 flex overflow-hidden">
                        {/* 左侧：播放器 */}
                        <div className="w-3/5 bg-black flex flex-col justify-center items-center relative">
                            <div className="w-full h-full flex items-center justify-center text-gray-500">
                                <div className="text-center">
                                    <IconUpload />
                                    <p className="mt-2 text-white">视频预览画面 ({task.name})</p>
                                </div>
                            </div>
                            {/* 底部进度条 */}
                            <div className="absolute bottom-0 w-full px-4 py-3 bg-gradient-to-t from-black/80 to-transparent">
                                <div className="h-1.5 bg-gray-600 rounded-full w-full">
                                    <div className="h-1.5 bg-indigo-500 rounded-full w-1/3"></div>
                                </div>
                            </div>
                        </div>

                        {/* 右侧：字幕列表 */}
                        <div className="w-2/5 border-l border-gray-200 flex flex-col bg-white">
                            <div className="p-4 border-b border-gray-100 text-sm font-bold text-gray-700 flex justify-between">
                                <span>确认字幕 (这一步还不出来)</span>
                                <span className="text-indigo-500 font-normal">共 {task.subtitles} 行</span>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {[...Array(6)].map((_, i) => (
                                    <div key={i} className={`p-3 rounded-lg border ${i === 0 ? 'bg-indigo-50 border-indigo-200' : 'border-gray-100 hover:bg-gray-50'}`}>
                                        <div className="text-xs text-indigo-500 mb-1">00:{i*10}:00 - 00:{i*10+3}:00</div>
                                        <div className="text-sm text-gray-800">这里是第 {i+1} 句字幕的示例文本内容。</div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 border-t border-gray-200 flex justify-end space-x-3 bg-gray-50">
                                <button className="px-4 py-2 text-sm text-gray-600 bg-white border border-gray-300 rounded-md hover:bg-gray-50">保存草稿</button>
                                <button className="px-4 py-2 text-sm text-white bg-indigo-600 rounded-md hover:bg-indigo-700 shadow-sm">确认无误，生成视频</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. 向导页 (首页组件)
        const WizardPage = ({ onEditTask }) => {
            const [step, setStep] = useState('pick'); // pick | running | done

            // 模拟点击导入后自动跑完
            const handleMockImport = () => {
                setStep('running');
                setTimeout(() => setStep('done'), 1500);
            };

            if (step === 'pick') {
                return (
                    <div className="flex flex-col items-center justify-center h-full">
                        <h2 className="text-2xl font-bold mb-8">给视频加字幕</h2>
                        <div 
                            onClick={handleMockImport}
                            className="w-[600px] h-[300px] border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-all"
                        >
                            <IconUpload />
                            <p className="mt-4 text-lg font-medium text-gray-700">把视频拖进来，或点击选择</p>
                            <p className="mt-1 text-sm text-gray-400">支持 mp4 · mkv · mov · avi · flv · webm</p>
                        </div>
                    </div>
                );
            }

            if (step === 'running') {
                return (
                    <div className="flex flex-col items-center justify-center h-full">
                        <div className="w-[600px] bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div className="flex justify-between text-sm mb-2"><span>正在识别与翻译...</span><span className="text-indigo-600">50%</span></div>
                            <div className="w-full bg-gray-200 rounded-full h-2.5"><div className="bg-indigo-600 h-2.5 rounded-full w-1/2 transition-all duration-300"></div></div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col items-center justify-center h-full">
                    <div className="w-[600px] bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
                        <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <h3 className="text-xl font-bold mb-2">处理完成</h3>
                        <p className="text-gray-500 mb-6">字幕草稿已就绪，请核对后生成视频。</p>
                        <div className="flex justify-center space-x-4">
                            <button onClick={() => setStep('pick')} className="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-md hover:bg-gray-50">再做一个</button>
                            {/* 核心回调：进入确认页 */}
                            <button onClick={() => onEditTask('t-001')} className="px-4 py-2 text-sm text-white bg-indigo-600 rounded-md hover:bg-indigo-700 shadow-sm">改字幕</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. 任务列表页
        const TaskList = ({ onEditTask }) => {
            return (
                <div className="p-8 max-w-4xl mx-auto">
                    <h2 className="text-2xl font-bold mb-6 text-gray-800">任务列表</h2>
                    <div className="bg-white border border-gray-200 rounded-lg overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th className="px-6 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider">文件名</th>
                                    <th className="px-6 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                    <th className="px-6 py-3 text-xs font-medium text-gray-500 uppercase tracking-wider text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                                {MOCK_TASKS.map(task => (
                                    <tr key={task.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{task.name}</td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-green-600">{task.status}</td>
                                        <td className="px-6 py-4 whitespace-nowrap text-right text-sm">
                                            {/* 核心回调：直达确认页 */}
                                            <button onClick={() => onEditTask(task.id)} className="text-indigo-600 hover:text-indigo-900 font-medium">修改字幕</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };


        // ==========================================
        // App 核心状态机
        // ==========================================
        const App = () => {
            // 核心视图状态
            const [appView, setAppView] = useState('main'); // 'main' | 'confirm'
            const [activeTab, setActiveTab] = useState('home'); // 'home' | 'tasks'
            const [activeTaskId, setActiveTaskId] = useState(null);
            
            // 用于强制重置向导组件内部状态的 key
            const [wizardKey, setWizardKey] = useState(Date.now());

            // 跳转至确认页
            const navigateToConfirm = (taskId) => {
                setActiveTaskId(taskId);
                setAppView('confirm');
            };

            // 返回主界面 (核心：清理状态)
            const navigateBackToMain = () => {
                setAppView('main');
                setActiveTaskId(null);
                // 如果是从向导进的确认页，返回时重置向导状态，防止双重渲染/状态残留
                if (activeTab === 'home') {
                    setWizardKey(Date.now()); 
                }
            };

            return (
                <div className="app-window">
                    {/* 模拟窗口标题栏 */}
                    <div className="window-titlebar">
                        <div className="dot bg-red-400"></div>
                        <div className="dot bg-yellow-400"></div>
                        <div className="dot bg-green-400"></div>
                        <span className="ml-2 font-medium">SubAI Translator v2.0 - {appView === 'main' ? '主界面' : '确认字幕'}</span>
                    </div>

                    {/* 视图栈路由 */}
                    {appView === 'confirm' && activeTaskId ? (
                        <SubtitleEditor taskId={activeTaskId} onBack={navigateBackToMain} />
                    ) : (
                        <div className="flex flex-1 overflow-hidden">
                            {/* 左侧导航栏 */}
                            <div className="w-56 bg-white border-r border-gray-200 flex flex-col">
                                <div className="p-4 border-b border-gray-100 flex items-center space-x-2">
                                    <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">S</div>
                                    <span className="font-bold text-gray-800">SubAI</span>
                                </div>
                                <nav className="flex-1 p-3 space-y-1">
                                    <button onClick={() => setActiveTab('home')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-md text-sm transition-colors ${activeTab === 'home' ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                                        <IconHome /> <span>首页 / 向导</span>
                                    </button>
                                    <button onClick={() => setActiveTab('tasks')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-md text-sm transition-colors ${activeTab === 'tasks' ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                                        <IconList /> <span>任务列表</span>
                                    </button>
                                </nav>
                            </div>

                            {/* 右侧内容区 */}
                            <div className="flex-1 bg-gray-50 overflow-y-auto">
                                {activeTab === 'home' && <WizardPage key={wizardKey} onEditTask={navigateToConfirm} />}
                                {activeTab === 'tasks' && <TaskList onEditTask={navigateToConfirm} />}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
