<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubAI 断句拆分原型 v12</title>
<style>
html.light{--bg:#f5f6fa;--card:#fff;--line:#e8ebf3;--line2:#c9d0e0;--text:#1b1e28;--dim:#565d6d;--accent:#5b4be0;--soft:rgba(91,75,224,.10);--warn:#8a5a00;--warnbar:#f0b429;--ok:#059669;--input:#fff;--danger:#dc2626;--shadow:0 1px 2px rgba(16,24,40,.06)}
html.dark{--bg:#0e0f13;--card:#16181f;--line:#262a36;--line2:#3a4155;--text:#eceef5;--dim:#9aa0b4;--accent:#8f84ff;--soft:rgba(143,132,255,.16);--warn:#e2b04a;--warnbar:#e2b04a;--ok:#39d98a;--input:#101219;--danger:#f87171;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-size:16px;font-weight:600}.brand i{font-style:normal;color:var(--accent)}
.btn{font-family:inherit;font-size:13.5px;cursor:pointer;border-radius:10px;padding:8px 14px;background:var(--card);color:var(--text);border:1px solid var(--line2)}
.btn:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
h1{font-size:19px;margin:0 0 6px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.list{padding:10px 10px 16px}
.row{position:relative;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;border-left:2px solid transparent;min-height:40px}
.row:hover{background:var(--bg)}
.row.ed{background:var(--soft);border-left-color:var(--accent)}
.row.split{border-left-color:var(--ok)}
.pt{width:12px;flex:none;color:var(--accent);font-size:11px}
.t{color:var(--dim);font-size:11.5px;min-width:96px;font-variant-numeric:tabular-nums}
.txt{flex:1;font-size:14.5px}
.mark{font-size:11px;border-radius:20px;padding:0 7px;margin-left:8px;border:1px solid var(--line2);color:var(--dim)}
.mark.ok{color:var(--ok);border-color:var(--ok)}
.rowacts{margin-left:auto;display:flex;gap:6px;opacity:0;transition:.15s}
.row:hover .rowacts{opacity:1}
.mini{font-size:11.5px;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:0 8px;cursor:pointer;white-space:nowrap;background:var(--card)}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.pop{position:absolute;right:8px;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line2);border-radius:11px;box-shadow:0 12px 30px rgba(0,0,0,.22);padding:6px;display:flex;gap:6px;z-index:20}
.pop:before{content:"";position:absolute;top:-6px;right:26px;width:10px;height:10px;background:var(--card);border-left:1px solid var(--line2);border-top:1px solid var(--line2);transform:rotate(45deg)}
.panel.flip{margin:0 10px 2px}
.panel{margin:2px 10px 12px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.bar2{display:flex;gap:8px;margin-bottom:10px}
.chip{flex:1;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.chip b{font-weight:600}
.chip em{font-style:normal;color:var(--dim);font-size:12px}
.track{position:relative;height:34px;margin:2px 0 6px;cursor:ew-resize}
.track .base{position:absolute;top:14px;left:0;right:0;height:6px;background:var(--line);border-radius:99px}
.track .fill{position:absolute;top:14px;left:0;height:6px;background:var(--soft);border-radius:99px}
.tick{position:absolute;top:13px;width:8px;height:8px;border-radius:50%;background:var(--card);border:1.5px dashed var(--accent);opacity:.75;transform:translateX(-4px)}
.tick:hover{opacity:1;transform:translateX(-4px) scale(1.25)}
.tick.hit{background:var(--ok);border:1.5px solid var(--ok);opacity:1;transform:translateX(-4px) scale(1.35);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
.cursor{position:absolute;top:6px;width:3px;height:22px;background:var(--accent);border-radius:2px;transform:translateX(-1.5px)}
.cursor.snapped{background:var(--ok);box-shadow:0 0 0 4px rgba(5,150,105,.15)}
.snaptip{position:absolute;top:-10px;font-size:11px;color:var(--ok);white-space:nowrap;transform:translateX(-50%)}
.hint{color:var(--dim);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.warnline{color:var(--warn);font-size:12.5px;margin-top:6px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.acts .btn{padding:7px 14px}
.bubble{position:absolute;right:14px;bottom:52px;background:var(--card);border:1px solid var(--warnbar);border-radius:11px;padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.22);font-size:12.5px;z-index:30;display:none;max-width:280px}
.bubble.show{display:block}
.bubble .acts{margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;font-size:13.5px;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{display:inline-block;border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-size:11.5px;color:var(--dim);margin:0 2px}
.steps{color:var(--dim);font-size:12.5px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">SubAI <i>Translator</i>　<span class="mark">拆分原型 v12</span></div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="toggleTheme()">切换主题</button>
      <button class="btn" onclick="undo()">Ctrl+Z 撤销</button>
    </div>
  </div>

  <h1>断句拆分（只在编辑态内微调）</h1>
  <div class="sub">鼠标移到任意行 → 出现「断句」→ 点开选「在此处拆分」→ 浮层里定切点（默认吸附词边界）→ 确认。</div>

  <div class="card"><div class="list" id="list"></div></div>

  <div class="steps">
    <b>四个状态都在这里：</b>
    ① 悬停出现「断句」小图标（列表不位移）
    ② 编辑态 + 光标处拆分，浮层**锚定在本行下方**（带小箭头、底色与行一致）
    ③ 游标靠近词边界会**吸附**（变绿 + 显示「已吸附: x.xs」）；第二句不足 0.5 秒时给**警告**，点确认弹小气泡（不粗暴禁用）
    ④ 拆分后得到两行，**仍然可以继续拆**（悬停各自出现「断句」）；<span class="kbd">Ctrl</span>+<span class="kbd">Z</span> 一步退回
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ROWS = [
  { id: "s1", start: 0.0,  end: 4.0,  text: "啊看不清啊", words: [0.0, 0.6, 1.2, 2.4, 4.0], split: false },
  { id: "s2", start: 6.0,  end: 7.0,  text: "我就怕你嫌我慢", words: [6.0, 6.4, 6.6, 7.0], split: false },
  { id: "s3", start: 7.0,  end: 8.0,  text: "我走东边你走西边", words: [7.0, 7.35, 7.7, 8.0], split: false },
  { id: "s4", start: 12.0, end: 14.0, text: "不是刷火你明白吗", words: [12.0, 12.5, 13.0, 14.0], split: false }
];
var STACK = [];          // Action 栈：只记动作与稳定 id（不记行号）
var EDIT = null;         // { id, pos } 正在拆的行
var POP = null;          // 断句小菜单的行 id
var CUR = 0.0;           // 浮层游标位置（秒）
var SNAP = true;

function idx(id) { for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === id) return i; return -1; }
function fmt(t) { var s = Math.max(0, Math.floor(t)); var m = Math.floor(s / 60); var r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
function fmt1(t) { return (Math.round(t * 10) / 10).toFixed(1) + "s"; }

function nearWord(r, t) {
  var best = r.words[0], d = 1e9;
  for (var i = 0; i < r.words.length; i++) { var dd = Math.abs(r.words[i] - t); if (dd < d) { d = dd; best = r.words[i]; } }
  return { t: best, dist: d };
}

function render() {
  var box = document.getElementById("list"), h = "";
  for (var i = 0; i < ROWS.length; i++) {
    var r = ROWS[i];
    h += '<div class="row' + (EDIT && EDIT.id === r.id ? " ed" : "") + (r.split ? " split" : "") + '" id="row-' + r.id + '">';
    h += '<div class="pt">▶</div><div class="t">' + fmt(r.start) + " → " + fmt(r.end) + '</div>';
    h += '<div class="txt">' + r.text + (r.split ? '<span class="mark ok">已拆分</span>' : '') + '</div>';
    h += '<div class="rowacts">';
    h += '<span class="mini" onclick="togglePop(\'' + r.id + '\')">断句</span>';
    h += '</div>';
    if (POP === r.id) {
      h += '<div class="pop">';
      h += '<span class="mini" onclick="merge(\'' + r.id + '\',-1)">⇧ 并入上行</span>';
      h += '<span class="mini" onclick="merge(\'' + r.id + '\',1)">⇩ 并入下行</span>';
      h += '<span class="mini" style="color:var(--accent);border-color:var(--accent)" onclick="startSplit(\'' + r.id + '\')">在此处拆分</span>';
      h += '</div>';
    }
    h += '</div>';
    if (EDIT && EDIT.id === r.id) h += panel(r, i >= ROWS.length - 2);
  }
  box.innerHTML = h;
}

function panel(r, flip) {
  var total = r.end - r.start;
  var left = CUR - r.start, right = r.end - CUR;
  var w = nearWord(r, CUR);
  var snapped = SNAP && w.dist < 0.18;
  var pct = ((CUR - r.start) / total) * 100;
  var h = '<div class="panel' + (flip ? ' flip' : '') + '" style="position:relative" id="panel">';
  if (flip) h += '<div style="color:var(--dim);font-size:11.5px;margin-bottom:6px">浮层已自动向上展开（避免被窗口底部截断）</div>';
  h += '<div class="bar2">';
  h += '<div class="chip"><b>' + r.text.slice(0, EDIT.pos) + '</b><em>' + fmt1(left) + '</em></div>';
  h += '<div class="chip"><b>' + r.text.slice(EDIT.pos) + '</b><em>' + fmt1(right) + '</em></div>';
  h += '</div>';
  h += '<div class="track" id="track" onclick="moveCursor(event)">';
  h += '<div class="base"></div><div class="fill" style="width:' + pct + '%"></div>';
  for (var i = 0; i < r.words.length; i++) {
    var p = ((r.words[i] - r.start) / total) * 100;
    var hit = snapped && Math.abs(r.words[i] - w.t) < 1e-6;
    h += '<div class="tick' + (hit ? " hit" : "") + '" style="left:' + p + '%"></div>';
  }
  h += '<div class="cursor' + (snapped ? " snapped" : "") + '" style="left:' + pct + '%"></div>';
  if (snapped) h += '<div class="snaptip" style="left:' + pct + '%">已吸附: ' + fmt1(w.t) + '</div>';
  h += '</div>';
  h += '<div class="hint"><span>拖动游标微调 · 虚线圆点=词边界，靠近会自动吸附（默认已取最近的词边界）</span><span>' + (snapped ? "已吸附到词边界 ✓" : "自由位置（未吸附）") + '</span></div>';
  if (right < 0.5) h += '<div class="warnline">⚠ 第二句只有 ' + fmt1(right) + '，不足 0.5 秒，可能听不清</div>';
  h += '<div class="acts">';
  h += '<button class="btn" onclick="cancelSplit()">取消</button>';
  h += '<button class="btn primary" onclick="confirmSplit()">确认拆分</button>';
  h += '</div>';
  h += '<div class="bubble" id="bubble">时长过短，可能听不清，确认继续？<div class="acts"><button class="btn" onclick="hideBubble()">再调调</button><button class="btn primary" onclick="doSplit()">继续拆分</button></div></div>';
  h += '</div>';
  return h;
}

function togglePop(id) { POP = (POP === id) ? null : id; EDIT = null; render(); }
function startSplit(id) {
  var r = ROWS[idx(id)];
  POP = null;
  var buf = r.text;                       // 用中点作为默认光标位（原型演示）
  var pos = Math.floor(buf.length / 2);
  EDIT = { id: id, pos: pos };
  var w = nearWord(r, r.start + (r.end - r.start) / 2);
  CUR = w.t;                              // 默认吸附到最近词边界
  render();
  toast("已进入拆分：切点默认落在最近的词边界 " + fmt1(CUR));
}
function moveCursor(e) {
  if (!EDIT) return;
  var r = ROWS[idx(EDIT.id)];
  var box = document.getElementById("track").getBoundingClientRect();
  var ratio = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
  CUR = r.start + ratio * (r.end - r.start);
  render();
}
function cancelSplit() { EDIT = null; render(); toast("已取消拆分"); }
function confirmSplit() {
  if (!EDIT) return;
  var r = ROWS[idx(EDIT.id)];
  if (r.end - CUR < 0.5) { document.getElementById("bubble").className = "bubble show"; return; }
  doSplit();
}
function hideBubble() { var b = document.getElementById("bubble"); if (b) b.className = "bubble"; }
function doSplit() {
  if (!EDIT) return;
  var r = ROWS[idx(EDIT.id)];
  var pos = EDIT.pos;
  var a = { id: r.id + "a", start: r.start, end: CUR, text: r.text.slice(0, pos), words: r.words.filter(function (w) { return w <= CUR; }).concat([CUR]), split: true };
  var b = { id: r.id + "b", start: CUR, end: r.end, text: r.text.slice(pos), words: [CUR].concat(r.words.filter(function (w) { return w > CUR; })), split: true };
  if (a.words.length < 2) a.words = [r.start, CUR];
  if (b.words.length < 2) b.words = [CUR, r.end];
  var i = idx(r.id);
  STACK.push({ type: "split", id: r.id, before: JSON.parse(JSON.stringify(r)), a: a, b: b });
  ROWS.splice(i, 1, a, b);
  EDIT = null;
  render();
  toast("已拆分为两行（" + fmt1(a.end - a.start) + " / " + fmt1(b.end - b.start) + "）· Ctrl+Z 可退回");
}
function merge(id, dir) {
  var i = idx(id);
  if (dir < 0 && i === 0) { toast("已经是最上面一行"); return; }
  if (dir > 0 && i === ROWS.length - 1) { toast("已经是最下面一行"); return; }
  var j = dir < 0 ? i - 1 : i + 1;
  var a = dir < 0 ? ROWS[j] : ROWS[i], b = dir < 0 ? ROWS[i] : ROWS[j];
  var merged = { id: a.id, start: a.start, end: b.end, text: a.text + b.text, words: a.words.concat(b.words), split: false };
  STACK.push({ type: "merge", ids: [a.id, b.id], merged: merged, raw: [JSON.parse(JSON.stringify(a)), JSON.parse(JSON.stringify(b))] });
  ROWS.splice(j, 2, merged);
  POP = null;
  render();
  toast("已合并两行 · Ctrl+Z 可退回");
}
function undo() {
  var act = STACK.pop();
  if (!act) { toast("没有可撤销的操作"); return; }
  if (act.type === "split") {
    var ia = idx(act.a.id), ib = idx(act.b.id);
    if (ia >= 0 && ib >= 0) ROWS.splice(Math.min(ia, ib), 2, act.before); else ROWS.push(act.before);
  } else if (act.type === "merge") {
    var im = idx(act.merged.id);
    if (im >= 0) ROWS.splice(im, 1, act.raw[0], act.raw[1]); else ROWS.push(act.raw[0], act.raw[1]);
  }
  render();
  toast("已撤销上一步");
}
var tt;
function toast(m) { var el = document.getElementById("toast"); el.textContent = m; el.className = "toast show"; clearTimeout(tt); tt = setTimeout(function () { el.className = "toast"; }, 2600); }
function toggleTheme() { var h = document.documentElement; h.className = (h.className === "light") ? "dark" : "light"; }
document.addEventListener("keydown", function (e) {
  if (e.ctrlKey && (e.key === "z" || e.key === "Z")) { e.preventDefault(); undo(); }
  else if (e.key === "Escape" && EDIT) { cancelSplit(); }
});
render();
</script>
</body>
</html>
