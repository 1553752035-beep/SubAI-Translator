# SubAI Translator —— 持续集成
#
# 说明：下列每一步的**命令**都已在本机验证通过（Windows），
# 但 GitHub Actions 的 Linux 运行环境无法在本机复现，
# 因此本文件在首次推送到 GitHub 之前**未经真实运行**；若首跑失败，请据日志调整。
#
# 需要外部资源的用例会自动跳过（ASR 模型不随仓库分发；本地 LLM 服务不在 CI 中）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装系统依赖（FFmpeg 与 OpenCV 运行时）
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        env:
          RUN_API_TESTS: '1'
        run: python -m pytest tests -q

  frontend:
    name: 前端测试 (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc -b

      - name: 运行测试
        run: npm test
