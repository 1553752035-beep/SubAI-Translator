[package]
name = "subai-translator"
version = "4.1.0"
description = "SubAI Translator - AI-powered video subtitle translation tool"
authors = ["SubAI Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
lazy_static = "1.4"
# 四期深化：自动更新（检查/下载/安装 + 重启）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows specific
[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.58", features = ["Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

# Unix specific (optional)
[target."cfg(not(target_os = \"windows\"))".dependencies]
nix = { version = "0.28", features = ["signal"], optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
