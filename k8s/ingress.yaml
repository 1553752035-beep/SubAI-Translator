# SubAI Translator —— Ingress（可选，对外暴露 + HTTPS 终止）
# 使用前请安装 Ingress Controller（nginx / traefik）并配置 TLS 证书。
# HTTPS 在 Ingress 层终止，后端仍走 HTTP（对应方案 3.6 的 HTTPS 要求）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: subai-backend
  namespace: subai
  annotations:
    # nginx 上传体积上限（默认 1m，视频上传需要调大）
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.subai-translator.example.com
      secretName: subai-tls-secret
  rules:
    - host: api.subai-translator.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: subai-backend
                port:
                  number: 8000
