# SubAI Translator —— 敏感配置（Secret）
# 使用 stringData 便于直接填写明文，kubectl 会自动 base64 编码。
# 生产环境建议改用 SealedSecret / External Secrets / Vault 注入。
apiVersion: v1
kind: Secret
metadata:
  name: subai-backend-secret
  namespace: subai
type: Opaque
stringData:
  # JWT 签名密钥（务必替换为强随机值）
  SUBAI_AUTH_JWT_SECRET: "please-change-me-in-production"

  # 首次启动自动创建的管理员账户（生产环境务必修改密码）
  SUBAI_AUTH_ADMIN_USERNAME: "admin"
  SUBAI_AUTH_ADMIN_PASSWORD: "admin123"

  # API 密钥列表（X-API-Key 认证，程序化访问用；逗号分隔多个）
  # SUBAI_SECURITY_API_KEYS: "key1,key2"
  SUBAI_SECURITY_API_KEYS: ""
