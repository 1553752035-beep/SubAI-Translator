[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
# [2026-10-25] 需要真实网络/外部服务的用例标记，
# 便于离线环境用 -m "not network" 跳过。
# 这些用例默认仍然执行 —— 它们验证的是「渠道真的能用」，
# 跳过等于放弃唯一的实测证据。
markers =
    network: 需要真实网络或外部服务（免费翻译渠道、provider 探测等）